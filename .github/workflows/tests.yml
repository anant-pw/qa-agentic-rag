name: unit-tests

# Unit tier only: pure routing/retrieval/grading logic plus SQL lookups via a
# fake connection. No Docker, Postgres, OpenSearch, Redis or Ollama needed.
# The live-stack checks (diagnostics/routing_check.py, eval/run_holdout.py,
# eval/run_eval_generation.py) stay manual -- they need the local model.

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
