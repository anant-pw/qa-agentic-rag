networks:
  rag-network:
    driver: bridge

volumes:
  postgres_data:
  opensearch_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-rag_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rag-network

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: rag-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
      # Required on 2.12+ or the security plugin's demo installer refuses to
      # start the node at all, security disabled or not. Local dev only —
      # never reuse this pattern for anything internet-facing.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-RagDev_2024!}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rag-network

  # Ollama runs natively on the host, not in Docker (Mac/Windows lose GPU/Metal
  # acceleration when Ollama is containerized). Ensure it's reachable with:
  #   OLLAMA_HOST=0.0.0.0 ollama serve
  # and confirm from the host with: curl http://localhost:11434/api/tags

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-fastapi
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
      OLLAMA_HOST: host.docker.internal
      OLLAMA_PORT: 11434
    extra_hosts:
      - "host.docker.internal:host-gateway"  # required on Linux; no-op on Mac/Windows
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    depends_on:
      - postgres
      - opensearch
    networks:
      - rag-network
